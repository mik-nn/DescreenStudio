[package]
name = "descreen-studio"
version = "0.4.0"
edition = "2021"
default-run = "descreen-studio"
description = "Descreen Studio Pro - neural halftone removal backend (Candle + ONNX fallback)"

[lib]
name = "descreen_studio"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Candle for ML inference (primary)
candle-core = { git = "https://github.com/huggingface/candle", branch = "main", features = ["cuda"] }
candle-nn = { git = "https://github.com/huggingface/candle", branch = "main" }
safetensors = "0.4"
clap = { version = "4.4", features = ["derive"] }
half = "2.4"

# ONNX runtime as fallback
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "directml"], optional = true }

ndarray = "0.17"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
rustfft = "6.2"
base64 = "0.22"
itertools = "0.13"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"

[[bin]]
name = "descreen_bench"
path = "src/bin/descreen_bench.rs"

[[bin]]
name = "candle_bench"
path = "src/bin/candle_bench.rs"

[features]
default = ["ort-backend"]
ort-backend = ["dep:ort"]

# Примечание: настройки CUDA для сборки (CUDARC_CUDA_VERSION, CUDA_PATH, NVCC)
# перенесены в .cargo/config.toml в корне репозитория — секция [env] здесь
# невалидна и cargo её игнорировал (warning "unused manifest key: env").